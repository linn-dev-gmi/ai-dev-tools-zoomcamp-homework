{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<div class="card" style="max-width:26rem">
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
    <label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}
    <label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}
    <p style="margin-top:1.2rem"><button class="btn" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
